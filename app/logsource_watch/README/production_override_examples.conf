# Example production overrides for Log Source Watch 4.9.3.
# Copy only needed stanzas to $SPLUNK_HOME/etc/apps/logsource_watch/local/

# savedsearches.conf
# Example: reduce last-seen collection cadence after measuring runtime.
[LSW_Update_LastSeen]
cron_schedule = */10 * * * *

# Example: run timed-maintenance expiry more frequently.
# [LSW_Expire_Maintenance]
# cron_schedule = */2 * * * *

# No lsw_lastseen_scope override is required in 4.9.3.
# LSW_Update_LastSeen derives monitored indexes from lsw_inventory.
