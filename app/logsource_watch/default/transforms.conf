[lsw_inventory]
external_type = kvstore
collection = lsw_inventory
case_sensitive_match = true
fields_list = _key, index, host, status, threshold_seconds, maintenance_until, change_ref, created_at, updated_at

[lsw_lastseen]
external_type = kvstore
collection = lsw_lastseen
case_sensitive_match = true
fields_list = _key, index, host, last_seen, updated_at

[lsw_health]
external_type = kvstore
collection = lsw_health
case_sensitive_match = true
fields_list = _key, component, last_run, scheduler_status, sid, version, updated_at

[lsw_state]
external_type = kvstore
collection = lsw_state
case_sensitive_match = true
fields_list = _key, index, host, status, threshold_seconds, threshold_minutes, maintenance_until, change_ref, last_seen, lastseen_updated_at, age_seconds, age_minutes, effective_state, alarm, state_updated_at

[lsw_audit]
external_type = kvstore
collection = lsw_audit
case_sensitive_match = true
fields_list = _key, event_time_epoch, actor, scope, operation, index, host, old_status, new_status, old_threshold_seconds, new_threshold_seconds, old_maintenance_until, new_maintenance_until, change_ref, details
