[lsw_calculate_state]
definition = eval threshold_seconds=coalesce(threshold_seconds,7200), threshold_minutes=round(threshold_seconds/60,0), maintenance_until=coalesce(maintenance_until,0), age_seconds=if(isnull(last_seen),null(),now()-last_seen), age_minutes=if(isnull(age_seconds),null(),round(age_seconds/60,1)) | eval effective_state=case(status=="retired","RETIRED",status=="maintenance" AND (maintenance_until=0 OR maintenance_until>now()),"MAINTENANCE",isnull(last_seen),"NO LOG OBSERVATION",age_seconds>threshold_seconds,"SILENT",true(),"OK") | eval alarm=if(effective_state=="SILENT",1,0), heartbeat_age_seconds=if(isnull(heartbeat_last_seen),null(),now()-heartbeat_last_seen), heartbeat_status=case(isnull(heartbeat_last_seen),"UNKNOWN",heartbeat_age_seconds<=`lsw_heartbeat_stale_seconds`,"ALIVE",true(),"STALE") | eval diagnosis=case(effective_state=="RETIRED","RETIRED",effective_state=="MAINTENANCE","MAINTENANCE",effective_state=="OK","SOURCE_REPORTING",effective_state=="SILENT" AND heartbeat_status=="ALIVE","SOURCE_SILENT_INTERNAL_ACTIVE",effective_state=="SILENT" AND heartbeat_status=="STALE","SOURCE_SILENT_INTERNAL_STALE",effective_state=="SILENT","SOURCE_SILENT_INTERNAL_UNKNOWN",effective_state=="NO LOG OBSERVATION" AND heartbeat_status=="ALIVE","NO_LOG_INTERNAL_ACTIVE",effective_state=="NO LOG OBSERVATION" AND heartbeat_status=="STALE","NO_LOG_INTERNAL_STALE",effective_state=="NO LOG OBSERVATION","NO_LOG_INTERNAL_UNKNOWN",true(),"UNKNOWN") | eval diagnosis_label=case(diagnosis=="SOURCE_REPORTING","Source reporting",diagnosis=="SOURCE_SILENT_INTERNAL_ACTIVE","Source silent · _internal active",diagnosis=="SOURCE_SILENT_INTERNAL_STALE","Source + _internal stale",diagnosis=="SOURCE_SILENT_INTERNAL_UNKNOWN","Source silent · no _internal evidence",diagnosis=="NO_LOG_INTERNAL_ACTIVE","No source observation · _internal active",diagnosis=="NO_LOG_INTERNAL_STALE","No source observation · _internal stale",diagnosis=="NO_LOG_INTERNAL_UNKNOWN","No source observation · no _internal evidence",diagnosis=="MAINTENANCE","Maintenance",diagnosis=="RETIRED","Retired",true(),"Unknown")
iseval = 0

[lsw_lastseen_scope]
definition = index="__LSW_NOT_CONFIGURED__" earliest=-15m latest=now
iseval = 0

[lsw_bulk_max_sources]
definition = 10000
iseval = 1

[lsw_heartbeat_stale_seconds]
definition = 900
iseval = 0
