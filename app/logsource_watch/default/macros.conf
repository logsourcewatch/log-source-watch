[lsw_calculate_state]
definition = eval threshold_seconds=coalesce(threshold_seconds,7200), threshold_minutes=round(threshold_seconds/60,0), maintenance_until=coalesce(maintenance_until,0), age_seconds=if(isnull(last_seen),null(),now()-last_seen), age_minutes=if(isnull(age_seconds),null(),round(age_seconds/60,1)) | eval effective_state=case(status=="retired","RETIRED",status=="maintenance" AND (maintenance_until=0 OR maintenance_until>now()),"MAINTENANCE",isnull(last_seen),"NO LOG OBSERVATION",age_seconds>threshold_seconds,"SILENT",true(),"OK") | eval alarm=if(effective_state=="SILENT",1,0)
iseval = 0

[lsw_lastseen_scope]
definition = index="__LSW_NOT_CONFIGURED__" earliest=-15m latest=now
iseval = 0

[lsw_bulk_max_sources]
definition = 10000
iseval = 1
