# Log Source Watch custom search command configuration.
# Built-in risky-command safeguards are intentionally not overridden.

[lsw_audit]
filename = lsw_audit.py
chunked = false
streaming = false
local = true
retainsevents = true
supports_getinfo = false
enableheader = true
needs_empty_results = false
run_in_preview = false
is_risky = true
python.version = python3
python.required = 3.9, 3.13

[lswlicense]
filename = lsw_license.py
generating = true
chunked = false
streaming = false
local = true
retainsevents = false
supports_getinfo = true
needs_empty_results = true
run_in_preview = false
is_risky = false
python.version = python3
python.required = 3.9, 3.13

[lswlicenseguard]
filename = lsw_license_guard.py
chunked = false
streaming = false
local = true
retainsevents = true
supports_getinfo = false
enableheader = true
passauth = true
needs_empty_results = false
run_in_preview = false
is_risky = true
python.version = python3
python.required = 3.9, 3.13

