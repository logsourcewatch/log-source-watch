# Log Source Watch administrative REST endpoints.
# App-scoped callers should use /servicesNS/nobody/logsource_watch/lsw/license.
# A Splunk restart is required when this file is introduced or changed.

[script:lsw_license_admin]
match = /lsw/license
scripttype = python
python.version = python3.9
handler = lsw_license_admin.LicenseAdminHandler
requireAuthentication = true
capability.get = admin_all_objects
capability.post = admin_all_objects
