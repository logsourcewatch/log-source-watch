# Log Source Watch 4.9.3

[LSW_Update_LastSeen]
description = Internal: update last_seen for registered log sources
search = | tstats latest(_time) AS seen WHERE [ | inputlookup lsw_inventory | where status="active" OR status="maintenance" | stats count BY index | fields index | append [ | makeresults | eval index="__LSW_NOT_CONFIGURED__" | fields index ] | format maxresults=0 ] BY index host | where isnotnull(host) AND len(host)>0 | eval _key=sha256(index."|".host) | lookup local=true lsw_inventory _key OUTPUT status AS inventory_status | where inventory_status="active" OR inventory_status="maintenance" | lookup local=true lsw_lastseen _key OUTPUT last_seen AS old_seen | eval last_seen=if(isnull(old_seen),seen,if(seen>old_seen,seen,old_seen)), updated_at=now() | fields _key index host last_seen updated_at | outputlookup append=true key_field=_key allow_updates=true override_if_empty=false lsw_lastseen
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -6h
dispatch.latest_time = now
is_visible = 0
max_concurrent = 1
dispatch.max_time = 240
dispatch.max_count = 25000
[LSW_Expire_Maintenance]
description = Internal: automatically reactivate expired timed maintenance windows
search = | inputlookup lsw_inventory | where status="maintenance" AND maintenance_until>0 AND maintenance_until<=now() | eval old_status=status, old_threshold_seconds=threshold_seconds, old_maintenance_until=maintenance_until, status="active", maintenance_until=0, updated_at=now(), change_ref="maintenance-expired" | appendpipe [ | eval event_time_epoch=now(), actor="system", scope="scheduler", operation="maintenance_expired", new_status=status, new_threshold_seconds=threshold_seconds, new_maintenance_until=maintenance_until, details="Timed maintenance expired automatically" | eval _key=sha256(tostring(event_time_epoch)."|".actor."|".index."|".host."|".operation) | fields _key event_time_epoch actor scope operation index host old_status new_status old_threshold_seconds new_threshold_seconds old_maintenance_until new_maintenance_until change_ref details | outputlookup append=true key_field=_key allow_updates=true override_if_empty=false lsw_audit | where 1=0 ] | fields _key index host status threshold_seconds maintenance_until change_ref created_at updated_at | outputlookup append=true key_field=_key allow_updates=true override_if_empty=false lsw_inventory
enableSched = 1
cron_schedule = 1-59/5 * * * *
is_visible = 0
max_concurrent = 1
[LSW_Build_State]
description = Internal: build canonical state table
search = | inputlookup lsw_inventory | lookup local=true lsw_lastseen _key OUTPUT last_seen updated_at AS lastseen_updated_at | `lsw_calculate_state` | eval state_updated_at=now() | fields _key index host status threshold_seconds threshold_minutes maintenance_until change_ref last_seen lastseen_updated_at age_seconds age_minutes effective_state alarm state_updated_at | outputlookup append=false key_field=_key allow_updates=true override_if_empty=true lsw_state
enableSched = 1
cron_schedule = 2-59/5 * * * *
is_visible = 0
max_concurrent = 1
[LSW_SilentHost]
description = Raw backend list of currently silent log sources for external monitoring. Persistent file: $SPLUNK_HOME/etc/apps/logsource_watch/lookups/lsw_silent_hosts.csv
search = | inputlookup lsw_state | where effective_state="SILENT" | fields index host age_seconds threshold_seconds last_seen | sort 0 index host
enableSched = 0
is_visible = 1
display.visualizations.show = 0
display.statistics.show = 1

[LSW_Health]
description = Raw backend health list for external monitoring. Persistent file: $SPLUNK_HOME/etc/apps/logsource_watch/lookups/lsw_health.csv
search = | makeresults | eval component=split("LSW_Update_LastSeen,LSW_Expire_Maintenance,LSW_Build_State,LSW_Export_SilentHost_File,LSW_Export_Health_File",",") | mvexpand component | eval component_type="scheduler" | fields component component_type | append [ search index=_internal sourcetype=scheduler earliest=-30m (savedsearch_name="LSW_Update_LastSeen" OR savedsearch_name="LSW_Expire_Maintenance" OR savedsearch_name="LSW_Build_State" OR savedsearch_name="LSW_Export_SilentHost_File" OR savedsearch_name="LSW_Export_Health_File") | stats latest(_time) AS last_run latest(status) AS scheduler_status latest(run_time) AS runtime_seconds BY savedsearch_name | rename savedsearch_name AS component | eval component_type="scheduler" ] | append [ | inputlookup lsw_inventory | stats count AS setup_inventory | eval component="__setup__", component_type="setup" ] | eventstats max(setup_inventory) AS setup_inventory | where component!="__setup__" | stats max(last_run) AS last_run latest(scheduler_status) AS scheduler_status max(runtime_seconds) AS runtime_seconds max(setup_inventory) AS setup_inventory BY component component_type | eval age_seconds=if(isnull(last_run),999999999,now()-last_run), records=null(), health=if(setup_inventory=0,"WAITING FOR SETUP",case(isnull(last_run),"STALE",age_seconds>900,"STALE",scheduler_status="success","OK",scheduler_status="skipped","WARN",true(),"ERROR")) | append [ | inputlookup lsw_inventory | stats count AS records max(updated_at) AS last_run | eval component="KV_lsw_inventory", component_type="kvstore", scheduler_status="DATA", runtime_seconds=null(), age_seconds=if(isnull(last_run),999999999,now()-last_run), health=if(records>0,"OK","NOT INITIALIZED") ] | append [ | inputlookup lsw_lastseen | stats count AS records max(updated_at) AS last_run | appendcols [ | inputlookup lsw_inventory | stats count AS inventory_records ] | eval component="KV_lsw_lastseen", component_type="kvstore", scheduler_status="DATA", runtime_seconds=null(), age_seconds=if(isnull(last_run),999999999,now()-last_run), health=case(inventory_records=0,"NOT INITIALIZED",records=0,"EMPTY",true(),"OK") | fields - inventory_records ] | append [ | inputlookup lsw_state | stats count AS records max(state_updated_at) AS last_run | appendcols [ | inputlookup lsw_inventory | stats count AS inventory_records ] | eval component="KV_lsw_state", component_type="kvstore", scheduler_status="DATA", runtime_seconds=null(), age_seconds=if(isnull(last_run),999999999,now()-last_run), health=case(inventory_records=0,"NOT INITIALIZED",records=0,"EMPTY",age_seconds>600,"STALE",true(),"OK") | fields - inventory_records ] | eval last_run_epoch=last_run | fields component component_type health last_run_epoch age_seconds scheduler_status runtime_seconds records | sort 0 component_type component
enableSched = 0
is_visible = 1
display.visualizations.show = 0
display.statistics.show = 1


[LSW_Export_SilentHost_File]
description = Internal: refresh persistent CSV backend file for current silent sources
search = | inputlookup lsw_state | where effective_state="SILENT" | fields index host age_seconds threshold_seconds last_seen | sort 0 index host | outputlookup lsw_silent_hosts.csv
enableSched = 1
cron_schedule = 3-59/5 * * * *
is_visible = 0
max_concurrent = 1
[LSW_Export_Health_File]
description = Internal: refresh persistent CSV backend file for application health
search = | savedsearch LSW_Health | outputlookup lsw_health.csv
enableSched = 1
cron_schedule = 4-59/5 * * * *
is_visible = 0
max_concurrent = 1
[LSW_AuditTrail]
search = | inputlookup lsw_audit | addinfo | where (info_min_time=0 OR event_time_epoch>=info_min_time) AND (info_max_time=0 OR event_time_epoch<=info_max_time) | eval Time=strftime(event_time_epoch,"%d.%m.%Y %H:%M:%S"), User=actor, Scope=scope, Action=operation, Old_status=coalesce(old_status,"-"), New_status=coalesce(new_status,"-"), Old_threshold=if(isnull(old_threshold_seconds),"-",round(old_threshold_seconds/60,1)." min"), New_threshold=if(isnull(new_threshold_seconds),"-",round(new_threshold_seconds/60,1)." min"), Old_maintenance=case(isnull(old_maintenance_until),"-",old_maintenance_until=0,"-",true(),strftime(old_maintenance_until,"%d.%m.%Y %H:%M:%S")), New_maintenance=case(isnull(new_maintenance_until),"-",new_maintenance_until=0,"-",true(),strftime(new_maintenance_until,"%d.%m.%Y %H:%M:%S")) | sort 0 - event_time_epoch | table Time User Scope Action index host Old_status New_status Old_threshold New_threshold Old_maintenance New_maintenance change_ref details
description = Backend Audit Trail search for Log Source Watch. Primary data is stored in the lsw_audit KV Store. The Reports menu opens the dedicated dark Audit Trail dashboard.
disabled = 0
enableSched = 0
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
display.general.type = statistics

